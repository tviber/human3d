name: browser-qa

# Key browser E2E for the workshop library: whole-library backup/restore and
# cross-tab concurrent writes. These drive the real UI, real Web Locks and the
# real IndexedDB snapshot path, which unit tests cannot cover. They need a
# stable GPU/browser host, so they run here rather than on a developer machine.
# This workflow is separate from `test` so the four-job required gate contract
# stays unchanged; require `browser-qa / library` in branch protection to make
# it a merge gate. It also runs the two acceptance paths that need a real
# browser: the racket-bevel/finger-shape controls (PR #33) and the agent review
# bundle → review gate (issue #32); both are documented as not runnable on the
# developer machine, so CI is where they actually execute.
#
# Debug loop: draft pull requests skip this workflow. While debugging, dispatch
# only the failing suites (`gh workflow run browser-qa --ref <branch> -f
# suites=knee`); such runs report as `library (partial: …)` so they can never
# stand in for the full `library` check. Marking the PR ready runs every suite.
# Suites run to completion even after an earlier one fails, so one full run
# reports every failure.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated suites, or "all": authoring, mobile, backup, concurrency, bevel, knee, review-bundle'
        required: false
        default: all
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.suites || 'all' }}
  cancel-in-progress: true

jobs:
  library:
    name: "${{ (inputs.suites && inputs.suites != 'all') && format('library (partial: {0})', inputs.suites) || 'library' }}"
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Select suites
        id: select
        env:
          SUITES: ${{ inputs.suites || 'all' }}
        run: |
          ALL="authoring mobile backup concurrency bevel knee review-bundle"
          list=","
          for s in $(printf '%s' "$SUITES" | tr ',' ' '); do
            if [ "$s" = all ]; then
              for a in $ALL; do list="$list$a,"; done
              continue
            fi
            case " $ALL " in
              *" $s "*) list="$list$s," ;;
              *) echo "::error::unknown suite '$s' (valid: all $ALL)"; exit 1 ;;
            esac
          done
          if [ "$list" = "," ]; then echo "::error::no suites selected"; exit 1; fi
          echo "Selected suites: $list"
          echo "list=$list" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start dev server
        id: server
        run: |
          npm run dev >"$RUNNER_TEMP/dev-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/dev-server.pid"
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5173/workshop.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/dev-server.log"
          exit 1
      # Each suite runs when selected and the dev server is up, regardless of
      # earlier suite failures; any failed suite still fails the job.
      - name: Imported action editing, rotation binding, and contact warnings (real UI)
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(steps.select.outputs.list, ',authoring,') }}
        run: node scripts/workshop-authoring-qa.mjs --out-dir "$RUNNER_TEMP/qa/workshop-authoring"
      - name: Mobile workshop and rotation controls (real UI)
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(steps.select.outputs.list, ',mobile,') }}
        run: node scripts/workshop-mobile-qa.mjs --out-dir "$RUNNER_TEMP/qa/workshop-mobile"
      - name: Library backup/restore (real UI writes, atomic failures)
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(steps.select.outputs.list, ',backup,') }}
        run: node scripts/library-backup-qa.mjs --out-dir "$RUNNER_TEMP/qa/library-backup"
      - name: Cross-tab concurrency and replace restore point
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(steps.select.outputs.list, ',concurrency,') }}
        run: |
          mkdir -p "$RUNNER_TEMP/qa"
          node scripts/library-concurrency-browser-qa.mjs >"$RUNNER_TEMP/qa/concurrency.log" 2>&1 || { cat "$RUNNER_TEMP/qa/concurrency.log"; exit 1; }
      - name: Racket bevels and finger shape (real UI controls)
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(steps.select.outputs.list, ',bevel,') }}
        run: node scripts/bevel-hand-qa.mjs --out-dir "$RUNNER_TEMP/qa/bevel-hand"
      - name: Knee handle, per-key grip toggle, leg-pole opt-in (real UI)
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(steps.select.outputs.list, ',knee,') }}
        run: node scripts/workshop-knee-qa.mjs --out-dir "$RUNNER_TEMP/qa/workshop-knee"
      - name: Capture and review the real issue-32 bundle
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(steps.select.outputs.list, ',review-bundle,') }}
        run: |
          mkdir -p "$RUNNER_TEMP/qa/review-bundle"
          node scripts/workshop-capture.mjs evidence/issue-32/ready-swing-contact.workshop.json --bundle --out-dir "$RUNNER_TEMP/qa/review-bundle/capture"
          node scripts/review-bundle-browser-qa.mjs "$RUNNER_TEMP/qa/review-bundle/capture"
      - name: Report partial suite selection
        if: ${{ always() && inputs.suites && inputs.suites != 'all' }}
        env:
          SUITES: ${{ inputs.suites }}
        run: echo "::notice::Partial browser QA selection '$SUITES' is diagnostic only and is not the required full library check."
      - name: Stop dev server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dev-server.pid" ]; then kill "$(cat "$RUNNER_TEMP/dev-server.pid")" 2>/dev/null || true; fi
          cat "$RUNNER_TEMP/dev-server.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-library
          path: |
            ${{ runner.temp }}/qa
            ${{ runner.temp }}/dev-server.log
          if-no-files-found: warn
