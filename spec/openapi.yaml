openapi: 3.1.0
info:
  title: human3d motion API
  version: 0.1.0
  description: |
    Kinematic human-motion service (protocol v1). Accepts an action id plus
    bounded parameters and returns a canonical pose package: per-bone local
    rotations + root translation on a shared timestamp grid, events, and a
    quality block. glTF/GLB export exists only as a derived product outside
    the service: the workshop UI and `npm run package-to-glb` bake a package
    into a GLB via src/core/glb-export.ts. Images/video/render requests and a
    server-side `glb` output format are not implemented.

    Design doc: docs/ANIMATION-PROTOCOL-PLAN.md
    Schemas: spec/motion-request.schema.json, spec/pose-package.schema.json,
    spec/rig-manifest.schema.json. The service compiles these with Ajv at
    startup, validates every request against the request schema, and validates
    every package against the package schema before returning it
    (src/server/contract.ts). Semantic limits are documented in docs/validation.md.

    Local deployment: loopback only. The Host header must be 127.0.0.1 or
    localhost; an Origin header, when present, must match Host; POST bodies must
    be application/json. Request bodies are capped at 1 MiB after decompression.
    No user-supplied scripts, file paths, or model files are accepted.
servers:
  - url: http://127.0.0.1:8788
    description: local reference service (npm run service)
paths:
  /v1/capabilities:
    get:
      operationId: listCapabilities
      summary: Service version, action catalog, rigs, parameter schemas, resource limits
      responses:
        '200':
          description: Capability catalog
          content:
            application/json:
              schema:
                type: object
                required: [service, rigs, actions, limits, endpoints]
                properties:
                  service:
                    type: object
                    properties:
                      name: {const: human3d-motion}
                      version: {type: string}
                      protocol: {const: v1}
                  rigs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        manifestSHA256: {type: string}
                        bones: {type: integer}
                        height: {type: number}
                        semantics: {type: object}
                  actions:
                    type: array
                    items: {$ref: '#/components/schemas/ActionDescriptor'}
                  limits: {type: object}
                  endpoints: {type: array, items: {type: string}}
  /v1/actions/{actionId}:
    get:
      operationId: getAction
      summary: Single action's parameter schema, provenance, revision and definition hash
      parameters:
        - name: actionId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Action descriptor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionDescriptor'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/rigs/{rigId}:
    get:
      operationId: getRig
      summary: Rig manifest — topology, rest local TRS, VRM semantic map, hashes
      parameters:
        - name: rigId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Rig manifest
          content:
            application/json:
              schema: {$ref: 'rig-manifest.schema.json'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/motions:
    post:
      operationId: runMotion
      summary: Solve an action into a canonical pose package (synchronous)
      description: |
        Returns `200` with the completed pose package when the solved motion
        passes the semantic checks. A motion that solves but fails them returns
        `422 motion_rejected`, with one message per failed check in
        `error.details`; the package is not returned.

        Preconditions: `action.revision` and `action.definitionSHA256` may pin
        the definition the client expects (both are listed by
        `GET /v1/actions/{actionId}`; for `workshop-doc` the hash is that of the
        submitted document). A mismatch returns `409 precondition_failed`.

        Idempotency: the `Idempotency-Key` header (1–128 visible ASCII
        characters) associates client retries with one run. Replaying the key
        with an identical request returns the stored response (200 or 422);
        reusing it with a different request returns `409 idempotency_conflict`.
        Keys expire after `limits.idempotencyTtlSeconds`; the cache is bounded
        by `limits.idempotencyMaxKeys` and `limits.idempotencyMaxBytes`.

        Identities: `provenance.requestFingerprint` hashes the request after
        defaults are filled in, so `{"action":{"id":"idle"}}` and the fully
        spelled-out form agree. The package `id` additionally covers the action
        definition hash, the rig manifest hash and the solver name and revision,
        so a solver or rig upgrade yields a new id for the same request. Canonical
        JSON uses sorted keys (full RFC 8785 JCS is planned).

        Request bodies may be sent with `Content-Encoding: gzip`; the size limit
        applies to the decompressed payload.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MotionRequest'}
      responses:
        '200':
          description: Completed pose package
          content:
            application/json:
              schema: {$ref: 'pose-package.schema.json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  schemas:
    MotionRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: object
          required: [id]
          additionalProperties: false
          properties:
            id:
              type: string
              enum: [idle, reach, squat, ready, forehand, workshop-doc]
            revision:
              type: string
              description: Optional precondition; a mismatch is 409 precondition_failed.
            definitionSHA256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: Optional precondition on the resolved definition hash; a mismatch is 409 precondition_failed.
            parameters:
              type: object
              description: |
                Per-action parameters, checked against that action's own schema
                (`parameters` in GET /v1/actions/{actionId}). Bundled actions
                accept only `{}`. `workshop-doc` requires `document`: WorkshopDoc
                JSON (named keyframes with pose targets and plant/grip/contact
                constraints; a planted key may also set `replant: true` to end
                the running contact interval and anchor a new one at its own
                stored foot — the mechanism duplicated keyframes use to own
                their support foot; each key may set `interpolation` to `hermite`
                (default) or `linear`, and its pose may set `handSpread` to an
                optional `{L?,R?}` of 0–1 — 0 closed fist, 0.5 relaxed (the
                absent default), 1 spread open — a sampled pose channel that
                changes the solved finger joints and interpolates like every
                other channel, so a fist can open across a transition; optional
                `headYaw` and `headPitch` pose angles are relative to the neck
                (yaw −80–80°, pitch −45–45°; both default to 0) and turn the
                solved head orientation; optional
                `freeArms: true` disables arm/elbow/wrist anatomical bend
                clamps for authoring; optional document flags such as
                `clavicleLift`, `gripSide` — 'R'|'L', default 'R', which hand
                holds the racket — and `gripBevel` — integer 1–8, default 1,
                which of the racket handle's eight bevels rests against the
                palm (palm-relative numbering, so the same number is the same
                grip on either hand and survives mirroring); the bevel is a
                prop-orientation choice, not a solve input — it changes the
                artifact id through the document but never the solved
                trajectory; at most 10 s and 120 keys). `schemaVersion` must be 2: older documents are refused
                with 400 `validation_failed`, never silently upgraded.
        rig:
          type: string
          default: makehuman-body
          description: Only 'makehuman-body' is servable; other rigs return 409 until a validated retarget adapter exists.
        outputs:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            required: [kind, format]
            properties:
              kind: {const: motion}
              format: {const: pose-json}
          description: Only pose-json is implemented; other formats return 400 unsupported_output. GLB exists solely as a client-side derived export (workshop button, scripts/package-to-glb.mts) — it is never a served format.
        sample:
          type: object
          additionalProperties: false
          properties:
            fps: {type: number, minimum: 1, maximum: 60, default: 40}
    ActionDescriptor:
      type: object
      required: [id, revision, title, english, kind, parameters, outputs, provenance]
      properties:
        id: {type: string}
        revision:
          type: string
          description: "workshop-doc-<first 12 hex digits of definitionSHA256> for bundled actions; workshop-doc/v5 for the client-supplied document action."
        definitionSHA256:
          type: [string, 'null']
          description: Hash of the resolved action definition; null for client-supplied documents, whose hash is computed per request.
        title: {type: string}
        english: {type: string}
        kind: {enum: [workshop-doc]}
        durationSeconds: {type: [number, 'null']}
        parameters: {type: object, description: JSON Schema for action.parameters}
        outputs: {type: array, items: {type: object}}
        phases:
          type: array
          items:
            type: object
            properties: {time: {type: number}, label: {type: string}}
        provenance:
          type: object
          properties:
            source: {type: string}
            license: {type: string}
            upstreamLicense: {type: string}
        notes: {type: array, items: {type: string}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_json, request_too_large, unsupported_media_type, forbidden, validation_failed, unknown_action, unknown_rig, unsupported_rig, unsupported_output, idempotency_conflict, precondition_failed, motion_rejected, not_found, internal]
            message: {type: string}
            details:
              type: array
              items: {type: string}
              description: Every failed check (400 validation, 422 semantic). Present when more than one problem was found.
            missing: {type: array, items: {type: string}, description: Capabilities the request would need that the service does not have}
            available: {type: array}
            expected: {type: object, description: The value the service expected, for 409 precondition_failed}
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
